services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-assettrack}
    ports:
      - "5456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d assettrack"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-assettrack}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changethis_to_something_secure}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PROJECT_NAME: ${PROJECT_NAME:-AssetTrack TI}
      TZ: ${TZ:-America/Sao_Paulo}
      PORT: "8080"
      GIN_MODE: release
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    # Lets webhook URLs reach services running on the Docker host (for example n8n).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace/repo
      - ./frontend:/workspace/frontend
      - ./scripts:/workspace/scripts
      - ./backend/uploads:/app/uploads
      - ./backend/uploads:/workspace/backend/uploads
      - ${ANDROID_SDK_PATH:-/home/humberto/Android/Sdk}:/opt/android-sdk:ro
      - backups_data:/app/backups

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_VERSION_CODE: ${VITE_APP_VERSION_CODE:-2}
        VITE_APP_VERSION_NAME: ${VITE_APP_VERSION_NAME:-1.2.0}
        VITE_APP_BUILD_TIMESTAMP: ${VITE_APP_BUILD_TIMESTAMP:-}
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  backups_data:

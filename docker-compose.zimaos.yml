services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assettrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assettrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-assettrack}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - zimaos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assettrack} -d ${POSTGRES_DB:-assettrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - zimaos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://assettrack:assettrack_password@db:5432/assettrack?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-troque_esta_chave_por_um_valor_grande_e_seguro}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PROJECT_NAME: ${PROJECT_NAME:-AssetTrack TI}
      TZ: ${TZ:-America/Sao_Paulo}
      PORT: "8080"
      GIN_MODE: release
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/uploads:/workspace/backend/uploads
      - zimaos_backups_data:/app/backups

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_VERSION_CODE: ${VITE_APP_VERSION_CODE:-2}
        VITE_APP_VERSION_NAME: ${VITE_APP_VERSION_NAME:-1.2.0}
        VITE_APP_BUILD_TIMESTAMP: ${VITE_APP_BUILD_TIMESTAMP:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - api

volumes:
  zimaos_postgres_data:
  zimaos_redis_data:
  zimaos_backups_data:
